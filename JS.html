    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast-animate-in flex items-center w-full p-4 text-slate-600 bg-white rounded-xl shadow-xl border border-slate-100 pointer-events-auto`;
      let iconHtml = '';
      if (type === 'success') iconHtml = `<div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-emerald-500 bg-emerald-50 rounded-lg"><i class="fa fa-circle-check text-base"></i></div>`;
      else if (type === 'error') iconHtml = `<div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-rose-500 bg-rose-50 rounded-lg"><i class="fa fa-circle-xmark text-base"></i></div>`;
      else iconHtml = `<div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-amber-500 bg-amber-50 rounded-lg"><i class="fa fa-triangle-exclamation text-base"></i></div>`;

      toast.innerHTML = `${iconHtml}<div class="ms-3 text-xs font-semibold text-slate-800 leading-snug">${message}</div><button type="button" class="ms-auto -mx-1.5 -my-1.5 bg-white text-slate-400 hover:text-slate-900 rounded-lg focus:ring-2 focus:ring-slate-300 p-1.5 hover:bg-slate-50 inline-flex items-center justify-center h-7 w-7 outline-none" data-dismiss-target="toast"><i class="fa fa-times"></i></button>`;
      container.appendChild(toast);
      const closeBtn = toast.querySelector('[data-dismiss-target="toast"]');
      closeBtn.addEventListener('click', () => {
        toast.classList.replace('toast-animate-in', 'toast-animate-out');
        toast.addEventListener('animationend', () => toast.remove());
      });
      setTimeout(() => { if (toast.parentNode) { toast.classList.replace('toast-animate-in', 'toast-animate-out'); toast.addEventListener('animationend', () => toast.remove()); } }, 4000);
    }

    function handleAsgError(err) { 
      console.warn("ระบบดักจับและจัดการ Exception สำเร็จ:", err); 
      showToast(`การเชื่อมต่อติดขัด: ${err.message || err}`, 'error');
    }

    // ฟังก์ชันสำหรับดึงยอดน้ำมันและรถยนต์มาแสดงที่แดชบอร์ดหน้าหลัก (Main Dashboard)


// ฟังก์ชันรวม เพื่อสั่งโหลดทุกอย่างบน Dashboard
function initDashboard() {
  loadMainDashboardFuelStats(); // โหลดข้อมูลน้ำมัน
  loadBookRegistryData();       // โหลดข้อมูลหนังสือ (ฟังก์ชันดึง allBooks ของท่าน)
}

// 1. ฟังก์ชันโหลดน้ำมัน (ของเดิมของท่าน)
function loadMainDashboardFuelStats() {
    google.script.run.withSuccessHandler(stats => {
        const dieselLeft = Math.max(0, (stats.dieselAdded || 0) - (stats.dieselDisbursed || 0));
        const benzeneLeft = Math.max(0, (stats.gasolineAdded || 0) - (stats.gasolineDisbursed || 0));
        
        if(document.getElementById('dashDieselLeftMain')) document.getElementById('dashDieselLeftMain').innerHTML = `${Number(dieselLeft).toLocaleString()} <span class="text-sm font-normal text-slate-400">ลิตร</span>`;
        if(document.getElementById('dashBenzeneLeftMain')) document.getElementById('dashBenzeneLeftMain').innerHTML = `${Number(benzeneLeft).toLocaleString()} <span class="text-sm font-normal text-slate-400">ลิตร</span>`;
        if(document.getElementById('dashTotalVehiclesMain')) document.getElementById('dashTotalVehiclesMain').innerHTML = `${stats.totalVehicles || 0} <span class="text-sm font-normal text-slate-400">คัน</span>`;
    }).getFuelDashboardOverview();
}

// 2. ฟังก์ชันโหลดหนังสือ (ฟังก์ชันนี้แหละที่จะสั่งวาดกราฟ)

    }).getBookRegistryRecords(); // (ชื่อฟังก์ชันดึงข้อมูลของท่าน)
}

    function getBase64Generic(file) {
      return new Promise((resolve, reject) => {
        if (!file) { resolve(''); return; }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function switchView(viewName) {
  // 1. เพิ่ม 'report' เข้าไปในรายการ views (จากเดิมจบที่ 'repair')
  const views = ['register', 'summary', 'daily', 'outgoing', 'control', 'fuel', 'usage', 'myTasks', 'repair', 'report']; 
  
  views.forEach(v => {
    const el = document.getElementById(v + 'View');
    if (el) el.classList.add('hidden');
  });

  views.forEach(v => {
    const btn = document.getElementById('btnTab' + v.charAt(0).toUpperCase() + v.slice(1));
    if (btn) btn.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition mt-1";
  });

  let activeTabClass = "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-blue-600 text-white transition mt-1";
  if(viewName === 'fuel' || viewName === 'usage') activeTabClass += " mt-4 border-t border-slate-700/50 pt-4";

  const targetView = document.getElementById(viewName + 'View');
  if (targetView) targetView.classList.remove('hidden');

  const targetBtn = document.getElementById('btnTab' + viewName.charAt(0).toUpperCase() + viewName.slice(1));
  if (targetBtn) targetBtn.className = activeTabClass;

  // 2. Logic การทำงานของแต่ละหน้า
  if (viewName === 'daily') {
    dailyFilterType = ''; 
    if(document.getElementById('filterDailyType')) document.getElementById('filterDailyType').value = '';
    renderDailyBooks(); 
  } else if (viewName === 'summary') {
    if (!allBooks || allBooks.length === 0) loadBooksData(); else renderDepartmentSummary();
  } else if (viewName === 'outgoing') {
    loadOutgoingBooks();
  } else if (viewName === 'control') {
    loadControlLedgerData();
  } else if (viewName === 'fuel') {
    switchFuelTab('depot'); 
  } else if (viewName === 'usage') {
    loadVehicleUsageData();
    google.script.run.withSuccessHandler(data => { vehicles = data || []; }).getVehicles();
  } else if (viewName === 'register') {
    const deptClean = String(currentUser.department).toLowerCase().trim();
    if (deptClean.indexOf('ผกบ') !== -1) {
      const adDash = document.getElementById('adminDashboard');
      if (adDash) adDash.classList.remove('hidden');
    }
  } else if (viewName === 'myTasks') {
    // 3. ใส่ฟังก์ชันโหลดข้อมูลหน้า "งานที่รับผิดชอบ" ของคุณที่นี่ (ถ้ามี)
    // ตัวอย่าง: loadMyTasksData();
    console.log("โหลดหน้างานที่รับผิดชอบสำเร็จ");
  // ... (โค้ดส่วนอื่นๆ คงเดิม) ...
  } else if (viewName === 'repair') {
    console.log("เปิดหน้าทะเบียนส่งซ่อม");
    if (typeof loadRepairData === 'function') {
        loadRepairData(); 
    }
  } else if (viewName === 'report') {
    // 3. เพิ่มการตรวจสอบสิทธิ์ตรงนี้ครับ
    const deptClean = String(currentUser.department).toLowerCase().trim();
    
    // ถ้าเป็น ผกบ. (Admin) -> ไม่ให้ดูหน้ารายงาน User ให้ส่งกลับไปหน้าหลักของ Admin
    if (deptClean.indexOf('ผกบ') !== -1) {
        console.log("Admin คลิกรายงาน - ให้กลับไปหน้าหลัก Admin");
        switchView('register'); // หรือหน้า dashboard ที่ท่านต้องการให้ Admin ดู
    } else {
        // ถ้าไม่ใช่ Admin (คือ User ทั่วไป) -> ให้โหลดหน้า Report (การ์ด 5 ใบ)
        initUserDashboard();
    }
  }
}

    function toggleSidebar() {
      const sidebar = document.getElementById('sideBarMenu');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (!sidebar) return;
      if (window.innerWidth < 768) {
        if (sidebar.classList.contains('-translate-x-full')) {
          sidebar.classList.replace('-translate-x-full', 'translate-x-0');
          if (backdrop) backdrop.classList.remove('hidden');
        } else {
          sidebar.classList.replace('translate-x-0', '-translate-x-full');
          if (backdrop) backdrop.classList.add('hidden');
        }
      }
    }

    function updateDepartmentDropdowns() {
      const regSelect = document.getElementById('regDept');
      const forwardSelect = document.getElementById('forwardToDept');
      const adminEditUserSelect = document.getElementById('adminEditDept');
      let optionsHtml = '<option value="">-- เลือกแผนกของคุณ --</option>';
      let forwardOptionsHtml = '<option value="">-- เลือกแผนกปลายทาง --</option>';
      let adminEditHtml = '';
      listDepts.forEach(dept => {
        optionsHtml += `<option value="${dept}">${dept}</option>`;
        forwardOptionsHtml += `<option value="${dept}">${dept}</option>`;
        adminEditHtml += `<option value="${dept}">${dept}</option>`;
      });
      if(regSelect) regSelect.innerHTML = optionsHtml;
      if(forwardSelect) forwardSelect.innerHTML = forwardOptionsHtml;
      if(adminEditUserSelect) adminEditUserSelect.innerHTML = adminEditHtml;
    }

    function evaluateAdminPrivileges() {

      const adminDeptBtn = document.getElementById('btnAdminDeptMenu');
      const adminUserBtn = document.getElementById('btnAdminUsersMenu');
      const deptClean = String(currentUser.department).toLowerCase().trim();
      if(deptClean.indexOf('ผกบ') !== -1) { 
        if(btnRegister) { btnRegister.classList.remove('hidden'); btnRegister.classList.add('flex'); }
        if(adminDeptBtn) { adminDeptBtn.classList.remove('hidden'); adminDeptBtn.classList.add('flex'); }
        if(adminUserBtn) { adminUserBtn.classList.remove('hidden'); adminUserBtn.classList.add('flex'); }
      } else { 
        if(btnRegister) { btnRegister.classList.add('hidden'); btnRegister.classList.remove('flex'); }
        if(adminDeptBtn) { adminDeptBtn.classList.add('hidden'); adminDeptBtn.classList.remove('flex'); }
        if(adminUserBtn) { adminUserBtn.classList.add('hidden'); adminUserBtn.classList.remove('flex'); }

    function openDeptManagementModal() { toggleModal('deptManagementModal', true); }

      container.innerHTML = listDepts.map(dept => {
        let clean = String(dept).trim();
        let deleteBtn = (clean === 'ผกบ.' || clean === 'ผกบ') ? '' : `<button onclick="handleDeleteDept('${dept}')" class="text-xs text-rose-500 hover:bg-rose-100 px-2 py-1 rounded-lg"><i class="fa fa-trash"></i></button>`;

    function handleAddNewDept(e) {
      e.preventDefault(); const input = document.getElementById('newDeptInput'); const name = input.value.trim(); if(!name) return;
      google.script.run.withFailureHandler(handleAsgError).withSuccessHandler(res => {
        if(res.success) { showToast(res.message, 'success'); input.value = ''; loadDepartmentsFromDb(); loadBooksData(); } 
        else showToast(res.message, 'warning');
      }).addDepartment(name);
    }

    function handleDeleteDept(name) {
      if(!confirm(`คุณมั่นใจที่จะลบแผนก "${name}" ใช่หรือไม่?`)) return;
      google.script.run.withFailureHandler(handleAsgError).withSuccessHandler(res => {
        if(res.success) { showToast(res.message, 'success'); loadDepartmentsFromDb(); loadBooksData(); }
        else showToast(res.message, 'error');
      }).deleteDepartment(name);
    }

    function openUserManagementModal() { toggleModal('userManagementModal', true); loadUsersFromDb(); }
    
    function loadUsersFromDb() {
      const container = document.getElementById('userManageList'); 
      if (container) {
        container.innerHTML = '<div class="text-center text-slate-400 py-6"><i class="fa fa-spinner fa-spin mr-1"></i> กำลังเรียกข้อมูล...</div>';
      }

      google.script.run
        .withFailureHandler((error) => {
          console.error("❌ พบข้อผิดพลาดจากหลังบ้าน:", error);
          if (container) {
            container.innerHTML = `<div class="text-rose-500 text-center py-4 font-bold"><i class="fa fa-exclamation-triangle mr-1"></i> ระบบหลังบ้านมีปัญหา:<br><span class="text-sm font-normal">${error.message}</span></div>`;
          }
        })
        .withSuccessHandler((data) => {
          console.log("✅ ข้อมูลที่ดึงมาจากฐานข้อมูล:", data);
          try {
            renderUserManagementList(data);
          } catch (renderError) {
            console.error("❌ ฟังก์ชัน renderUserManagementList มีปัญหา:", renderError);
            if (container) {
              container.innerHTML = `<div class="text-amber-600 text-center py-4 font-bold"><i class="fa fa-bug mr-1"></i> ดึงข้อมูลสำเร็จ แต่แสดงผลไม่ได้:<br><span class="text-sm font-normal">${renderError.message}</span></div>`;
            }
          }
        })
        .getUsers();
    }

    function renderUserManagementList(users) {
      const container = document.getElementById('userManageList'); if (!container) return;
      if (!users || users.length === 0) { container.innerHTML = '<div class="text-center text-slate-400 py-6">ไม่พบรายชื่อผู้ใช้งาน</div>'; return; }
      container.innerHTML = users.map(user => {
        let avatar = user.profile_pic || defaultAvatar; let isSelf = user.username === currentUser.username;
        let continuousCount = 0;
        if (Array.isArray(cachedWorkloadData) && user.name) {
          let matchedWorkload = cachedWorkloadData.find(w => w && w.label && String(w.label).indexOf(user.name) !== -1);
          if (matchedWorkload) continuousCount = matchedWorkload.value || 0;
        }
        let deleteBtn = isSelf ? '' : `<button onclick="handleDeleteUser('${user.username}', '${user.name}')" class="text-[11px] font-semibold text-rose-600 hover:bg-rose-50 px-2 py-1.5 border border-rose-200 rounded-lg flex items-center gap-1"><i class="fa fa-trash-can"></i> ลบ</button>`;
        let editBtn = `<button onclick="openAdminEditUserModal('${user.username}', '${user.name}', '${user.department}')" class="text-[11px] font-semibold text-blue-600 hover:bg-blue-50 px-2 py-1.5 border border-blue-200 rounded-lg flex items-center gap-1"><i class="fa fa-pen-to-square"></i> แก้ไข</button>`;
        return `<div class="flex items-center justify-between p-3 bg-white border rounded-xl shadow-sm mb-2"><div class="flex items-center gap-3 overflow-hidden"><img src="${avatar}" class="w-10 h-10 rounded-full object-cover border bg-slate-50 flex-shrink-0"><div class="overflow-hidden"><div class="font-bold text-slate-800 text-sm truncate flex items-center flex-wrap gap-1"><span>${user.name}</span><span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[9px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 flex-shrink-0">งานสะสม: ${continuousCount} ครั้ง</span></div><div class="text-[11px] text-slate-400 font-mono truncate">ID: ${user.username} | สังกัด: แผนก ${user.department}</div></div></div><div class="flex-shrink-0 ml-2 flex items-center gap-1.5">${editBtn}${isSelf ? '<span class="text-[10px] bg-slate-50 text-slate-400 px-2 py-1.5 rounded-md border font-normal">ตัวคุณ</span>' : deleteBtn}</div></div>`;
      }).join('');
    }

    function openAdminEditUserModal(username, name, dept) {
      document.getElementById('adminEditUsername').value = username; document.getElementById('adminEditUserDisplay').value = username;
      document.getElementById('adminEditFullName').value = name; document.getElementById('adminEditDept').value = dept;
      toggleModal('adminEditUserModal', true);
    }

    function submitAdminEditUser(e) {
      e.preventDefault();
      const uData = { username: document.getElementById('adminEditUsername').value, name: document.getElementById('adminEditFullName').value, department: document.getElementById('adminEditDept').value };
      google.script.run.withFailureHandler(handleAsgError).withSuccessHandler(res => {
        if(res.success) { showToast(res.message, 'success'); toggleModal('adminEditUserModal', false); loadUsersFromDb(); loadBooksData(); } 
        else showToast(res.message, 'error');
      }).updateUserByAdmin(uData);
    }

    function handleDeleteUser(username, name) {
      if (!confirm(`คุณต้องการลบคุณ "${name}" (${username}) ออกจากระบบใช่หรือไม่?`)) return;
      google.script.run.withFailureHandler(handleAsgError).withSuccessHandler(res => {
        if (res.success) { showToast(res.message, 'success'); loadUsersFromDb(); } else showToast(res.message, 'error');
      }).deleteUser(username);
    }

    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio; canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio); signaturePad.clear(); 
    }

    function toggleModal(id, show, isEdit = false) {
      const modal = document.getElementById(id); if(!modal) return;
      if(show) {
        modal.classList.remove('hidden');
        if(id === 'forwardModal') setTimeout(resizeCanvas, 50);
        
        if(id === 'registerModal' && !isEdit) {
          document.getElementById('formTitle').innerHTML = '<i class="fa fa-file-medical"></i> ลงทะเบียนรับหนังสือใหม่';
          document.getElementById('editBookId').value = ''; 
          document.getElementById('registerForm').reset();
          document.getElementById('regDate').value = new Date().toISOString().split('T')[0];
          
          google.script.run.withSuccessHandler(nextNo => {
             document.getElementById('regNum').value = nextNo;
          }).getNextRegisterNumber();
        }
      } else modal.classList.add('hidden');
    }

    function handleCheckboxToggle(type) {
      if (type === 'last' && document.getElementById('isLastStep').checked) document.getElementById('isReturn').checked = false;
      else if (type === 'return' && document.getElementById('isReturn').checked) document.getElementById('isLastStep').checked = false;
    }

    function toggleReturnFilter() {
      isFilterReturnMode = !isFilterReturnMode;
      const btn = document.getElementById('btnFilterReturn'); const txt = document.getElementById('filterText');
      if (isFilterReturnMode) {
        btn.className = "text-xs bg-rose-600 text-white hover:bg-rose-700 px-3 py-2 rounded-full flex items-center gap-1.5 font-semibold"; txt.innerText = 'แสดงงานทั้งหมด';
      } else {
        btn.className = "text-xs text-rose-500 hover:text-rose-700 transition bg-rose-50 hover:bg-rose-100 px-3 py-2 rounded-full border border-rose-200 flex items-center gap-1.5 font-semibold"; txt.innerText = 'ดูงานที่ส่งคืนแก้ไข';
      }
      renderBooks(allBooks); 
    }

    function handleSearch() { searchQuery = document.getElementById('tableSearch').value.toLowerCase().trim(); renderBooks(allBooks); }
    function handleDailySearch() { dailySearchQuery = document.getElementById('dailyTableSearch').value.toLowerCase().trim(); renderDailyBooks(); }

    function filterByWorkloadDept(dept) {
      const badge = document.getElementById('activeDeptBadge');
      if (selectedWorkloadDept === dept) { selectedWorkloadDept = ''; badge.classList.add('hidden'); } 
      else { selectedWorkloadDept = dept; badge.innerText = `ตัวกรอง: แผนก ${dept}`; badge.classList.remove('hidden'); }
      renderBooks(allBooks);
    }

    function handleInlineReturnToggle(bookId, isChecked) {
      google.script.run.withFailureHandler(handleAsgError).withSuccessHandler(() => { showToast("เปลี่ยนสถานะส่งคืนเรียบร้อย", 'success'); loadBooksData(); }).toggleReturnStatus(bookId, isChecked, currentUser.department, currentUser.name);
    }

    async function getBase64Image(file) {
      return new Promise((resolve) => {
        if (!file) { resolve(''); return; }
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const MAX_SIZE = 150; let width = img.width; let height = img.height;
            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
            const cvs = document.createElement('canvas'); cvs.width = width; cvs.height = height;
            cvs.getContext('2d').drawImage(img, 0, 0, width, height); resolve(cvs.toDataURL('image/jpeg', 0.8)); 
          };
        };
      });
    }

    function renderBooks(books) {
      if (books) {
         if (!Array.isArray(books)) books = [];
         allBooks = books;
      }
      const tbody = document.getElementById('bookTableBody');
      let displayBooks = allBooks;

      if (isFilterReturnMode) displayBooks = displayBooks.filter(b => b.status === 'ส่งคืนแก้ไข');
      if (selectedWorkloadDept) displayBooks = displayBooks.filter(b => b.current_dept === selectedWorkloadDept);
      
      if (searchQuery) {
        displayBooks = displayBooks.filter(b => {
          return (b.ทะเบียนรับ && String(b.ทะเบียนรับ).toLowerCase().includes(searchQuery)) ||
                 (b.ที่ && String(b.ที่).toLowerCase().includes(searchQuery)) ||
                 (b.จาก && String(b.จาก).toLowerCase().includes(searchQuery)) ||
                 (b.เรื่อง && String(b.เรื่อง).toLowerCase().includes(searchQuery));
        });
      }

      currentFilteredBooks = displayBooks;

      let myDeptBooksReturned = displayBooks.filter(b => b.current_dept === currentUser.department && b.status === 'ส่งคืนแก้ไข');
      const notifyBox = document.getElementById('smartNotificationCenter'); const notifyTxt = document.getElementById('notificationText');

      } else { if(notifyBox) notifyBox.classList.add('hidden'); }

      if (!document.getElementById('summaryView').classList.contains('hidden')) renderDepartmentSummary();

      const deptClean = String(currentUser.department).toLowerCase().trim();

        document.getElementById('statTotal').innerText = allBooks.length;
        document.getElementById('statPending').innerText = allBooks.filter(b => b.status === 'อยู่ระหว่างดำเนินการ' || b.status === 'รอดำเนินการ').length;
        document.getElementById('statSuccess').innerText = allBooks.filter(b => b.status === 'เสร็จสิ้น').length;
        document.getElementById('statReturned').innerText = allBooks.filter(b => b.status === 'ส่งคืนแก้ไข').length;

        const depts = listDepts.length > 0 ? listDepts : ["ผกบ.", "ฝพธ.", "ฝสภ."];
        // กราฟดึงข้อมูลที่ "ไม่เท่ากับ เสร็จสิ้น" มาแสดง (ถือเป็นงานตกค้าง)
        const deptData = depts.map(dept => allBooks.filter(b => b.current_dept === dept && b.status !== 'เสร็จสิ้น').length);

        if (myChart) myChart.destroy();
        const ctx = document.getElementById('workloadChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: depts, datasets: [{ data: deptData, backgroundColor: '#2563eb', borderRadius: 6 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,

    function renderBooksTablePage(page) {
    console.log("กำลังสั่งวาดตารางหน้าที่:", page);
    console.log("จำนวนข้อมูลใน currentFilteredBooks:", currentFilteredBooks ? currentFilteredBooks.length : 'ยังไม่มีข้อมูล');

    try {
        currentMainPage = page;
        const tbody = document.getElementById('bookTableBody');

        // ป้องกันกรณี currentFilteredBooks เป็น undefined
        if (!currentFilteredBooks || currentFilteredBooks.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">ไม่มีรายการหนังสือแสดงในหน้านี้</td></tr>`;
            if (typeof renderPaginationControls === 'function') renderPaginationControls(0);
            return;
        }

        const startIndex = (page - 1) * mainItemsPerPage;
        const endIndex = startIndex + mainItemsPerPage;
        const pageBooks = currentFilteredBooks.slice(startIndex, endIndex);

        // จุดที่มักจะเกิด Error คือ generateBookRow
        tbody.innerHTML = pageBooks.map(book => generateBookRow(book)).join('');
        
        if (typeof renderPaginationControls === 'function') renderPaginationControls(currentFilteredBooks.length);
        console.log("วาดตารางสำเร็จเรียบร้อย!");

    } catch (error) {
        // 🔴 ถ้ามีการ Error (เช่นหา generateBookRow ไม่เจอ) มันจะฟ้องสีแดงตรงนี้เลยครับ

        document.getElementById('bookTableBody').innerHTML = `

                    <b>เกิดข้อผิดพลาดในการสร้างแถวข้อมูล:</b> ${error.message}
                </td>
            </tr>`;
    }
}

    function renderPaginationControls(totalItems) {
       const container = document.getElementById('mainPaginationContainer');
       if (!container) return;

       if (totalItems <= mainItemsPerPage) {
          container.innerHTML = '';
          return;
       }

       const totalPages = Math.ceil(totalItems / mainItemsPerPage);
       let html = '<div class="flex items-center justify-between py-3 border-t border-slate-100">';
       
       html += `<div class="flex items-center justify-between md:hidden w-full">
                  <button onclick="renderBooksTablePage(${currentMainPage - 1})" ${currentMainPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 border border-slate-300 text-xs font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 ${currentMainPage === 1 ? 'opacity-50' : ''}">ก่อนหน้า</button>
                  <span class="text-xs text-slate-700 font-medium">หน้า ${currentMainPage} / ${totalPages}</span>
                  <button onclick="renderBooksTablePage(${currentMainPage + 1})" ${currentMainPage === totalPages ? 'disabled' : ''} class="px-3 py-1.5 border border-slate-300 text-xs font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 ${currentMainPage === totalPages ? 'opacity-50' : ''}">ถัดไป</button>
                </div>`;

       html += `<div class="hidden md:flex-1 md:flex md:items-center md:justify-between">
                  <div>
                    <p class="text-xs text-slate-500">
                      แสดง <span class="font-bold text-slate-700">${((currentMainPage - 1) * mainItemsPerPage) + 1}</span> ถึง 
                      <span class="font-bold text-slate-700">${Math.min(currentMainPage * mainItemsPerPage, totalItems)}</span> 
                      จาก <span class="font-bold text-slate-700">${totalItems}</span> รายการ
                    </p>
                  </div>
                  <div>
                    <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">`;

       html += `<button onclick="renderBooksTablePage(${currentMainPage - 1})" ${currentMainPage === 1 ? 'disabled' : ''} class="relative inline-flex items-center px-2 py-1.5 rounded-l-md border border-slate-300 bg-white text-xs font-medium text-slate-500 hover:bg-slate-50 ${currentMainPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}"><i class="fa fa-chevron-left"></i></button>`;

       let startPage = Math.max(1, currentMainPage - 2);
       let endPage = Math.min(totalPages, currentMainPage + 2);

       if (startPage > 1) {
          html += `<button onclick="renderBooksTablePage(1)" class="relative inline-flex items-center px-3 py-1.5 border border-slate-300 bg-white text-xs font-medium text-slate-700 hover:bg-slate-50">1</button>`;
          if (startPage > 2) html += `<span class="relative inline-flex items-center px-2 py-1.5 border-y border-slate-300 bg-white text-xs text-slate-400">...</span>`;
       }

       for (let i = startPage; i <= endPage; i++) {
          if (i === currentMainPage) {
             html += `<button aria-current="page" class="z-10 bg-blue-50 border-blue-500 text-blue-700 relative inline-flex items-center px-3 py-1.5 border text-xs font-bold">${i}</button>`;
            } else {
             html += `<button onclick="renderBooksTablePage(${i})" class="bg-white border-slate-300 text-slate-700 hover:bg-slate-50 relative inline-flex items-center px-3 py-1.5 border text-xs font-medium">${i}</button>`;
            }
       }

       if (endPage < totalPages) {
          if (endPage < totalPages - 1) html += `<span class="relative inline-flex items-center px-2 py-1.5 border-y border-slate-300 bg-white text-xs text-slate-400">...</span>`;
          html += `<button onclick="renderBooksTablePage(${totalPages})" class="relative inline-flex items-center px-3 py-1.5 border border-slate-300 bg-white text-xs font-medium text-slate-700 hover:bg-slate-50">${totalPages}</button>`;
       }

       html += `<button onclick="renderBooksTablePage(${currentMainPage + 1})" ${currentMainPage === totalPages ? 'disabled' : ''} class="relative inline-flex items-center px-2 py-1.5 rounded-r-md border border-slate-300 bg-white text-xs font-medium text-slate-500 hover:bg-slate-50 ${currentMainPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}"><i class="fa fa-chevron-right"></i></button>`;

       html += `</nav></div></div></div>`;
       container.innerHTML = html;
    }

    function renderDailyBooks() {

      if (!tbody) return;
      const todayStr = new Date().toISOString().split('T')[0];
      let dailyBooks = allBooks.filter(b => b.parent_id === undefined && b.วันที่ === todayStr);

      if (dailyFilterType) dailyBooks = dailyBooks.filter(b => b.book_type === dailyFilterType);
      if (dailySearchQuery) {
        dailyBooks = dailyBooks.filter(b => {
          return (b.ทะเบียนรับ && String(b.ทะเบียนรับ).toLowerCase().includes(dailySearchQuery)) ||
                 (b.ที่ && String(b.ที่).toLowerCase().includes(dailySearchQuery)) ||
                 (b.จาก && String(b.จาก).toLowerCase().includes(dailySearchQuery)) ||
                 (b.เรื่อง && String(b.เรื่อง).toLowerCase().includes(dailySearchQuery));
        });
      }

      let countGen = 0, countProc = 0, countMaint = 0;
      dailyBooks.forEach(b => {
        if (b.book_type === 'ทั่วไป') countGen++;
        else if (b.book_type === 'จัดหา/จัดซื้อ/จัดจ้าง/เบิกเงิน') countProc++;
        else if (b.book_type === 'ซ่อมปรับปรุง') countMaint++;
      });

      if (summaryContainer) {
        summaryContainer.innerHTML = `
          <div class="px-3 py-1.5 bg-blue-50 border border-blue-200 rounded-xl text-xs font-bold text-blue-800 shadow-sm flex items-center gap-1"><i class="fa fa-folder-open"></i> วันนี้รวมทั้งหมด: ${dailyBooks.length}</div>

          <div class="px-3 py-1.5 bg-amber-50 border border-amber-200 rounded-xl text-xs font-semibold text-amber-800 shadow-sm">จัดซื้อจัดจ้าง: ${countProc}</div>
          <div class="px-3 py-1.5 bg-purple-50 border border-purple-200 rounded-xl text-xs font-semibold text-purple-800 shadow-sm">ซ่อมบำรุง: ${countMaint}</div>
        `;
      }

      if (dailyBooks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">ไม่มีรายการงานหนังสือสำหรับวันนี้ (หรือข้อมูลไม่ตรงกับตัวกรอง)</td></tr>`; return;
      }
      tbody.innerHTML = dailyBooks.map(book => generateBookRow(book)).join('');
    }

    function renderUserWorkloadChart(data) {
      if (!data || !Array.isArray(data)) return; cachedWorkloadData = data;
      const labels = data.map(item => item.label); const values = data.map(item => item.value);
      const total = values.reduce((sum, val) => sum + val, 0); const percents = values.map(val => total > 0 ? parseFloat(((val / total) * 100).toFixed(1)) : 0);
      if (myUserChart) myUserChart.destroy();
      myUserChart = new Chart(document.getElementById('userWorkloadChart').getContext('2d'), {
        type: 'bar', data: { labels: labels, datasets: [{ data: percents, backgroundColor: '#6366f1', borderRadius: 6 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } } }
      });
    }

    function renderLiveTimeline(entries) {
    const container = document.getElementById('liveTimelineContainer');

    if (!entries || entries.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-400 py-12 flex flex-col items-center justify-center"><i class="fa-solid fa-inbox text-3xl mb-2 opacity-20"></i><span class="text-xs font-medium">ไม่มีประวัติความเคลื่อนไหว</span></div>';
        return;
    }

    let htmlText = '';
    const limit = Math.min(entries.length, 8); // แสดงแค่ 8 รายการล่าสุด

    for (let i = 0; i < limit; i++) {
        let e = entries[i];
        let subject = e.subject ? e.subject : 'ไม่ระบุชื่อเรื่อง';
        
        let noteHtml = '';
        if (e.note && e.note !== e.subject) {
            noteHtml = '<div class="text-[10px] text-slate-400 mt-1.5 ml-5 truncate"><i class="fa-regular fa-comment-dots mr-1"></i>' + e.note + '</div>';

        htmlText +=   '<div class="flex justify-between items-start gap-3">';
        htmlText +=     '<div class="font-bold text-slate-800 text-[12px] truncate" title="' + subject + '"><i class="fa-solid fa-file-lines text-indigo-500 mr-1.5"></i>' + subject + '</div>';
        htmlText +=     '<div class="text-slate-400 font-mono text-[10px] shrink-0 mt-0.5">' + (e.timestamp || '-') + '</div>';
        htmlText +=   '</div>';
        htmlText +=   '<div class="flex items-center text-[10px] text-slate-500 mt-1.5 ml-5">';
        htmlText +=     '<span class="bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">' + (e.department_from || '-') + '</span>';
        htmlText +=     '<i class="fa-solid fa-arrow-right-long text-slate-300 mx-2"></i>';

    }

    function exportControlToExcel() {
      let csvContent = "\uFEFF"; 
      const table = document.querySelector("#controlExportArea table");
      const rows = table.querySelectorAll("tr");
      
      rows.forEach((row, i) => {
          let rowData = [];
          const cols = row.querySelectorAll("td, th");
          
          cols.forEach((col, j) => {
              if(j === cols.length - 1) return; 
              let textData = col.innerText.replace(/"/g, '""').replace(/\n/g, ' ').trim();
              rowData.push('"' + textData + '"');
          });
          csvContent += rowData.join(",") + "\r\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", "บัญชีคุม_สป_ทั่วไป.csv");
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      showToast('ส่งออกไฟล์ Excel สำเร็จ', 'success');
    }

    function updateFuelDashboard() {
      if (typeof fuelDepots === 'undefined' || (typeof fuelLogs === 'undefined' && typeof fuelLogData === 'undefined')) {
        return; 
      }

      let elDiesel = document.getElementById('dashDieselLeft');
      let elBenzene = document.getElementById('dashBenzeneLeft');
      let elVehicles = document.getElementById('dashTotalVehicles');

      let logsData = (typeof fuelLogs !== 'undefined') ? fuelLogs : (typeof fuelLogData !== 'undefined' ? fuelLogData : []);

      let inDiesel = 0, inBenzene = 0;
      let outDiesel = 0, outBenzene = 0;

      if (typeof fuelDepots !== 'undefined') {
        fuelDepots.forEach(row => {
          let status = String(row.status || '').trim();
          if (status === 'รับน้ำมันแล้ว' || status === 'เสร็จสิ้น' || status === 'รับคลังแล้ว') {
            let qty = Number(row.liter) || 0;
            if (String(row.type).includes('ดีเซล')) inDiesel += qty;
            else inBenzene += qty;
          }
        });
      }

      logsData.forEach(log => {
        let qty = Number(log.liter || log.amount) || 0;
        let type = String(log.type || log.fuelType || '');
        if (type.includes('ดีเซล')) outDiesel += qty;
        else outBenzene += qty;
      });

      console.log(`📊 น้ำมันดีเซล: รับเข้า ${inDiesel} ลิตร | จ่ายออก ${outDiesel} ลิตร`);
      console.log(`📊 น้ำมันเบนซิน: รับเข้า ${inBenzene} ลิตร | จ่ายออก ${outBenzene} ลิตร`);

      let remainDiesel = inDiesel - outDiesel;
      let remainBenzene = inBenzene - outBenzene;

      if (elDiesel) elDiesel.innerHTML = `${remainDiesel.toLocaleString()} <span class="text-sm font-normal">ลิตร</span>`;
      if (elBenzene) elBenzene.innerHTML = `${remainBenzene.toLocaleString()} <span class="text-sm font-normal">ลิตร</span>`;
      
      if (elVehicles && typeof vehicles !== 'undefined') {
        elVehicles.innerHTML = `${vehicles.length} <span class="text-sm font-normal">คัน</span>`;
      }
    }

    // 2. ฟังก์ชันใหม่ (อัปเดตกราฟ) - เปลี่ยนชื่อเป็น refreshFuelCharts

  // 1. ฟังก์ชันที่ท่านมีอยู่เดิม (ห้ามเปลี่ยนชื่อ)
  function refreshFuelCharts() {
    google.script.run

        // ให้เรียกใช้ฟังก์ชัน getFuelDashboardData ที่ท่านคำนวณไว้ใน Code.gs
        // และแปลงค่าให้ renderDonutChart ของท่านใช้งานได้
        if (fuelData.success) {
           const labels = ["ดีเซล", "เบนซิน/แก๊สโซฮอล์"];
           const data = [fuelData.dieselFinal, fuelData.benzeneFinal];
           renderDonutChart(labels, data);
        }
      })
      .getFuelDashboardData(); // ชื่อเดิมที่ท่านยืนยันว่าถูกต้อง

  // 2. ใช้ฟังก์ชันเดิมที่ท่านเคยมี (เพื่อไม่ให้ระบบงง)

  // 3. ใช้ฟังก์ชันรวมนี้รันอัตโนมัติ

    function submitFuelLog(e) {
    e.preventDefault(); // ป้องกันหน้าเว็บรีเฟรชตอนกดปุ่ม
    
    // 1. เปลี่ยนข้อความปุ่มเพื่อบอกผู้ใช้ว่ากำลังบันทึก
    const btn = document.getElementById('btnFlSubmit');
    if(btn) btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> บันทึก...';
      
    // 🎯 เพิ่ม Logic การตรวจสอบประเภท (ยานพาหนะ หรือ อุปกรณ์)
    const targetType = document.querySelector('input[name="fuelTargetType"]:checked').value;
    const isVehicle = (targetType === 'vehicle');

    // 2. ดึงข้อมูลจากฟอร์ม
    // ปรับการดึง vid ถ้าเป็นอุปกรณ์ให้ใช้รหัส 'EQUIP' หรือค่าว่าง
    const vid = isVehicle ? document.getElementById('flVehicle').value : 'EQUIPMENT';
    const vObj = (isVehicle && typeof vehicles !== 'undefined' && vehicles) ? vehicles.find(x => x.id == vid) : null;
    const hiddenId = document.getElementById('editFuelLogId') ? document.getElementById('editFuelLogId').value : '';
    
    // 🎯 ปรับการดึงชื่อ (ถ้าเป็นรถใช้ทะเบียน ถ้าเป็นอุปกรณ์ใช้ค่าจาก flEquipment)
    const targetName = isVehicle ? (vObj ? vObj.govReg : '-') : document.getElementById('flEquipment').value;

    const data = {
        logId: hiddenId,
        date: document.getElementById('flDate').value,
        vehicleId: vid, 
        vehicleReg: targetName, // ส่งชื่ออุปกรณ์หรือทะเบียนรถไปในช่องนี้
        type: document.getElementById('flType').value,
        liter: document.getElementById('flLiter').value,
        // 🎯 ถ้าเป็นอุปกรณ์ ให้เลขไมล์เป็น 0 หรือค่าว่าง
        mileage: isVehicle ? document.getElementById('flMileage').value : '0', 
        recorder: (typeof currentUser !== 'undefined' && currentUser.name) ? currentUser.name : 'เจ้าหน้าที่'
    };
      
    // 3. โค้ดส่งข้อมูลไปหลังบ้าน
    google.script.run.withSuccessHandler((res) => { 
        // คืนค่าปุ่มกลับมาเหมือนเดิม
        if(btn) btn.innerHTML = 'บันทึกการเติม';

        if(res.success) {
            // 1. ปิดหน้าต่าง, ล้างฟอร์ม, แจ้งเตือน 
            toggleModal('fuelLogModal', false); 
            document.getElementById('fuelLogForm').reset();
            
            // รีเซ็ตฟอร์มประเภทให้กลับเป็นรถ (ค่าเริ่มต้น)
            document.querySelector('input[value="vehicle"]').checked = true;
            if (typeof toggleFuelTargetType === 'function') toggleFuelTargetType();

            if(document.getElementById('editFuelLogId')) document.getElementById('editFuelLogId').value = '';
            showToast(res.message, "success"); 
            
            // 2. โหลดตารางประวัติใหม่
            if (typeof loadFuelLogData === 'function') loadFuelLogData(); 

            // 3. สั่งโหลดแดชบอร์ดด้านบนใหม่ทั้งหมด
            setTimeout(() => {
                if (typeof loadMainDashboardFuelStats === 'function') {
                    loadMainDashboardFuelStats(); 
                }
            }, 800); 

        } else {
            showToast(res.message, "error");
        }
    }).saveFuelLog(data);
}

    function loadVehicleUsageData() {
      const tbody = document.getElementById('usageTableBody');
      tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-400">กำลังประมวลผลข้อมูลใช้รถ...</td></tr>';
      google.script.run.withSuccessHandler(data => {
        vehicleUsages = data || [];
        renderVehicleUsageTable();
        calculateUsageDashboard();
      }).getVehicleUsages();
    }

    // 🔴 1. ประกาศตัวแปรสำหรับแบ่งหน้า (วางไว้ส่วนบนสุดของ script หรือก่อนฟังก์ชัน)
let currentUsagePage = 1;
const usageRowsPerPage = 10; // ปรับจำนวนบรรทัดต่อหน้าได้ที่นี่

// 🔴 2. ฟังก์ชันวาดตารางของท่าน (ที่อัปเกรดระบบแบ่งหน้าแล้ว)
function renderVehicleUsageTable() {
  const tbody = document.getElementById('usageTableBody'); 
  if(!tbody) return;
  
  let filtered = vehicleUsages;
  
  // โค้ดค้นหาของท่าน (เหมือนเดิม)
  if (usageTableSearchQuery) {
    filtered = filtered.filter(u => 
      u.vehicleReg.toLowerCase().includes(usageTableSearchQuery) ||
      u.driver.toLowerCase().includes(usageTableSearchQuery) ||
      u.purpose.toLowerCase().includes(usageTableSearchQuery)
    );
  }
  
  // ถ้าไม่มีข้อมูล
  if(filtered.length === 0) { 
    tbody.innerHTML = '<tr><td colspan="8" class="p-8 text-center text-slate-400">ไม่มีบันทึกข้อมูลการใช้รถในระบบ</td></tr>'; 
    updateUsagePagination(0, 0, 0, 0); // รีเซ็ตแถบหน้า
    return; 
  }

  // ==========================================
  // 🟢 ส่วนที่เพิ่มเข้ามา: คำนวณเพื่อ "ตัดแบ่งหน้า"
  // ==========================================
  const totalPages = Math.ceil(filtered.length / usageRowsPerPage);
  if (currentUsagePage > totalPages) currentUsagePage = totalPages;

  const startIndex = (currentUsagePage - 1) * usageRowsPerPage;
  const endIndex = Math.min(startIndex + usageRowsPerPage, filtered.length);
  
  // ตัดข้อมูลมาเฉพาะของหน้านั้นๆ (เช่น ข้อมูลที่ 1 ถึง 10)
  const pageData = filtered.slice(startIndex, endIndex);

  // ==========================================
  // วาดตาราง (ใช้โค้ดเดิมของท่าน 100% เปลี่ยนแค่ใช้ pageData.map)
  // ==========================================
  tbody.innerHTML = pageData.map(u => {
    let returnDisplay = u.returnTime ? u.returnTime.replace('T', ' ') : '-';
    let mileReturn = u.endMileage ? u.endMileage : '-';
    let statusBadge = u.status === 'เสร็จสิ้นภารกิจ' ? `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold">กลับหน่วยแล้ว</span>` : `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold pulse-red">ออกภารกิจ</span>`;
    let actBtn = u.status === 'อยู่ระหว่างภารกิจ' 
      ? `<button onclick="openReturnUsageModal('${u.usageId}', '${u.vehicleId}', '${u.startMileage}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded text-[11px] font-bold"><i class="fa fa-flag-checkered"></i> บันทึกกลับ</button>`
      : `<button onclick="deleteUsageEntry('${u.usageId}')" class="text-rose-600"><i class="fa fa-trash"></i></button>`;

    return `<tr class="border-b hover:bg-slate-50 transition text-xs">
      <td class="p-3">${u.departureTime.replace('T', ' ')}</td>
      <td class="p-3">${returnDisplay}</td>
      <td class="p-3 font-bold text-slate-700">${u.vehicleReg}</td>
      <td class="p-3">${u.driver}</td>
      <td class="p-3 text-slate-600 font-semibold">${u.purpose}</td>
      <td class="p-3 text-center">${u.startMileage} ➔ ${mileReturn}</td>
      <td class="p-3 text-center">${statusBadge}</td>
      <td class="p-3 text-center exclude-pdf">${actBtn}</td>
    </tr>`;
  }).join('');

  // สั่งอัปเดตปุ่มกดเปลี่ยนหน้าด้านล่างตาราง
  updateUsagePagination(startIndex + 1, endIndex, filtered.length, totalPages);
}

// 🔴 3. ฟังก์ชันสร้างปุ่มกดหน้า (Pagination Controls)
function updateUsagePagination(start, end, total, totalPages) {
  // ใส่ตัวเลขสรุป
  const elStart = document.getElementById('usageStartIndex');
  const elEnd = document.getElementById('usageEndIndex');
  const elTotal = document.getElementById('usageTotalItems');
  
  if(elStart) elStart.innerText = start;
  if(elEnd) elEnd.innerText = end;
  if(elTotal) elTotal.innerText = total;

  const controlDiv = document.getElementById('usagePaginationControls');
  if (!controlDiv) return;
  if (total === 0) { controlDiv.innerHTML = ''; return; }

  let html = '';
  
  // ปุ่ม ย้อนกลับ (<)
  const prevDisabled = currentUsagePage === 1 ? 'disabled class="w-7 h-7 flex items-center justify-center text-slate-300 cursor-not-allowed"' : 'class="w-7 h-7 flex items-center justify-center text-slate-500 hover:bg-slate-200 hover:text-slate-700 rounded transition-colors" onclick="changeUsagePage(' + (currentUsagePage - 1) + ')"';
  html += `<button ${prevDisabled}><i class="fa-solid fa-chevron-left text-[10px]"></i></button>`;

  // วนลูปสร้างตัวเลข 1, 2, 3 ...
  for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentUsagePage - 1 && i <= currentUsagePage + 1)) {
          if (i === currentUsagePage) {
              html += `<button class="w-7 h-7 flex items-center justify-center bg-indigo-600 text-white rounded-lg text-xs font-bold shadow-sm mx-0.5">${i}</button>`;
          } else {
              html += `<button onclick="changeUsagePage(${i})" class="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-slate-200 rounded-lg text-xs font-semibold transition-colors mx-0.5">${i}</button>`;
          }
      } else if (i === currentUsagePage - 2 || i === currentUsagePage + 2) {
          html += `<span class="text-slate-400 px-1 text-xs">...</span>`;
      }
  }

  // ปุ่ม ถัดไป (>)
  const nextDisabled = currentUsagePage === totalPages ? 'disabled class="w-7 h-7 flex items-center justify-center text-slate-300 cursor-not-allowed"' : 'class="w-7 h-7 flex items-center justify-center text-slate-500 hover:bg-slate-200 hover:text-slate-700 rounded transition-colors" onclick="changeUsagePage(' + (currentUsagePage + 1) + ')"';
  html += `<button ${nextDisabled}><i class="fa-solid fa-chevron-right text-[10px]"></i></button>`;

  controlDiv.innerHTML = html;
}

// 🔴 4. ฟังก์ชันเปลี่ยนหน้า (เมื่อกดปุ่มตัวเลข)
function changeUsagePage(pageNumber) {

        // 3. วาดตารางดีไซน์ใหม่ (ใส่ class group เพื่อทำ Hover Effect)
        html += `
        <tr class="border-b border-slate-100 hover:bg-blue-50/40 transition text-xs group">

                    <i class="fa-solid fa-paper-plane text-slate-300"></i>

                </div>
            </td>
            
            <td class="p-3 align-middle">

                </div>

                <div class="flex flex-col gap-0.5">
                    <div class="flex items-center gap-1.5 text-slate-700 font-medium">

                            <i class="fa-solid fa-user"></i>

                        <i class="fa fa-trash"></i>
                    </button>
                </div>
            </td>

        `;
    });

    tbody.innerHTML = html;

    // 4. โหลดรายชื่อผู้รับผิดชอบ
    var userSelect = document.getElementById('procResponsibleSelect');
    if (userSelect && userSelect.options.length <= 1) {
        userSelect.innerHTML = '<option value="">-- กำลังโหลดรายชื่อ... --</option>';

    // ==========================================
// ส่วนของการกดปุ่ม "แก้ไข" และ "ลบ" ของจริง
// ==========================================

// ฟังก์ชันดึงข้อมูลเก่ามาใส่ในฟอร์มเพื่อแก้ไข
window.editProcStep = function(stepId) {
    // หาข้อมูลจากตัวแปรที่เราโหลดเก็บไว้ตอนเปิดหน้าต่าง
    if (!window.currentProcHistory) return;
    
    var stepData = window.currentProcHistory.find(function(item) {
        return item.stepId === stepId;
    });
    
    if (stepData) {
        // หยอดข้อมูลกลับลงไปในช่อง Input ต่างๆ ของฟอร์ม
        document.getElementById('procStepId').value = stepData.stepId; // รหัสซ่อน
        
        if(document.getElementById('procStepName')) document.getElementById('procStepName').value = stepData.stepName;
        
        // จัดการลบลูกน้ำออกก่อนใส่ช่องจำนวนเงิน
        if(document.getElementById('procAmount') && stepData.amount) {
            document.getElementById('procAmount').value = stepData.amount.toString().replace(/,/g, '');
        }

        google.script.run

                    showToast(res.message, 'success');
                    
                    // เมื่อลบเสร็จ สั่งให้โหลดประวัติใหม่มาแสดงทันที
                    var bookId = document.getElementById('procBookId').value;
                    google.script.run
                        .withSuccessHandler(function(data) {
                            window.currentProcHistory = data;
                            renderHistoryUI(data);
                        })
                        .getProcHistory(bookId);
                        
                } else {
                    showToast(res.message, 'error');
                }
            })
            .withFailureHandler(function(err) {
                showToast("เกิดข้อผิดพลาดในการลบ: " + err.message, 'error');
            })
            .deleteProcStepData(stepId);
    }
};

    // ฟังก์ชันสำหรับบันทึกขั้นตอนการดำเนินงาน/จัดหา
window.submitProcStep = function(e) {
    e.preventDefault(); // ป้องกันหน้าเว็บรีเฟรช
    
    var btn = document.getElementById('btnProcSubmit');
    if (btn) {
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';
        btn.disabled = true;
    }
    
    // ดึงข้อมูลจากฟอร์ม
    var data = {
        stepId: document.getElementById('procStepId') ? document.getElementById('procStepId').value : '',
        bookId: document.getElementById('procBookId').value,
        stepName: document.getElementById('procStepName').value,
        amount: document.getElementById('procAmount').value,
        date: document.getElementById('procDate').value,
        note: document.getElementById('procNote').value,
        responsible: document.getElementById('procResponsibleSelect').value
    };
    
    // ส่งข้อมูลไปบันทึกที่หลังบ้าน (Google Apps Script)
    google.script.run
        .withSuccessHandler(function(res) {
            showToast(res.message || 'บันทึกขั้นตอนสำเร็จ', 'success');
            
            // รีเซ็ตฟอร์มเตรียมบันทึกรายการถัดไป แต่ยังเก็บชื่อเรื่องกับจำนวนเงินไว้
            var title = document.getElementById('procTitle').value;
            document.getElementById('procForm').reset();
            document.getElementById('procBookId').value = data.bookId;
            document.getElementById('procStepId').value = '';
            document.getElementById('procTitle').value = title;
            document.getElementById('procAmount').value = data.amount;
            
            if (document.getElementById('btnProcCancel')) {
                document.getElementById('btnProcCancel').classList.add('hidden');
            }
            if (btn) {
                btn.innerHTML = 'บันทึกข้อมูล';
                btn.disabled = false;
            }
            
            // โหลดประวัติใหม่มาแสดงทันที
            var historyContainer = document.getElementById('procHistoryContainer');
            if (historyContainer) historyContainer.innerHTML = '<div class="text-center text-slate-400 py-4 text-xs"><i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังดึงข้อมูลประวัติ...</div>';
            
            google.script.run.withSuccessHandler(renderHistoryUI).getProcHistory(data.bookId);
        })
        .withFailureHandler(function(err) {
            showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
            if (btn) {
                btn.innerHTML = 'บันทึกข้อมูล';
                btn.disabled = false;
            }
        })
        .saveProcStep(data);
};

window.toggleSignup = function(show) {
    var signupModal = document.getElementById('signupModal');
    var loginModal = document.getElementById('loginModal'); 
    
    if (signupModal) {
        // 1. เช็คว่ามีการสั่งเปิด/ปิดแบบเด็ดขาดหรือไม่ (เช่น ส่งค่า true/false มา)
        if (typeof show === 'boolean') {
            if (show) {
                signupModal.classList.remove('hidden'); // สั่งเปิด
            } else {
                signupModal.classList.add('hidden'); // สั่งปิด (ปุ่มยกเลิก หรือ สมัครสำเร็จ)
                
                // ล้างข้อมูลในฟอร์มเมื่อปิดหน้าต่างทิ้ง (ป้องกันข้อมูลค้าง)
                document.getElementById('regFullName').value = '';
                document.getElementById('regDept').value = '';
                document.getElementById('regUser').value = '';
                document.getElementById('regPass').value = '';
                document.getElementById('regProfilePic').value = '';
            }
        } else {
            // 2. ถ้าไม่ได้ส่งค่ามา (เรียกฟังก์ชันเฉยๆ) ให้ทำหน้าที่สลับสถานะ (Toggle)
            signupModal.classList.toggle('hidden');
        }
    }
    
    // 3. จัดการซ่อนหน้าล็อกอิน (ถ้าหน้าสมัครกำลังแสดงอยู่)
    if (loginModal && !signupModal.classList.contains('hidden')) {
        loginModal.classList.add('hidden'); 
    }
    
    // (เสริม) ถ้าหน้าสมัครถูกปิดลง อาจจะให้สลับกลับไปโชว์หน้าล็อกอินอัตโนมัติ
    if (loginModal && signupModal.classList.contains('hidden')) {
        loginModal.classList.remove('hidden');
    }
};

// ฟังก์ชันแปลงลิงก์รูป
// ฟังก์ชันนี้จะแปลงลิงก์หน้า View ของ Google Drive ให้เป็นลิงก์ไฟล์ภาพตรงๆ
// 1. ฟังก์ชันแปลงลิงก์ Google Drive ให้เป็นลิงก์ไฟล์ภาพตรงๆ
window.getDriveImageUrl = function(url) {
    if (!url || url === "" || url === "User") return "https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff&size=40"; 
    
    // ถ้าเป็น Base64 ก็ส่งคืนเลย
    if (url.startsWith("data:image")) return url;

    // ถ้าเป็นลิงก์ Google Drive
    if (url.includes("drive.google.com")) {
        // ดึง ID ออกมาจากลิงก์ ไม่ว่าจะเป็น view หรือ file/d/
        var match = url.match(/[-\w]{25,}/);

            return "https://drive.google.com/uc?id=" + match[0];

// ฟังก์ชันตั้งค่าวาดกราฟโดนัท
// ประกาศตัวแปรแยกสำหรับกราฟ 2 วง
var dieselChartInstance = null;
var benzeneChartInstance = null;

function renderDonutChart(labels, data) {
    // 1. แยกยอด ดีเซล กับ เบนซิน ออกจากกัน
    let dieselAmt = 0;
    let benzeneAmt = 0;
    
    for(let i = 0; i < labels.length; i++) {
        let text = labels[i].toLowerCase();
        if(text.includes('ดีเซล')) {
            dieselAmt += data[i];
        } else {
            benzeneAmt += data[i];
        }
    }

    // 2. อัปเดตตัวเลขตรงกลางกราฟ
    let elDiesel = document.getElementById('centerDiesel');
    let elBenzene = document.getElementById('centerBenzene');
    if(elDiesel) elDiesel.innerText = dieselAmt.toLocaleString();
    if(elBenzene) elBenzene.innerText = benzeneAmt.toLocaleString();

    // 3. กำหนดสี (ถ้ามีน้ำมันให้แสดงสี ถ้าเป็น 0 ลิตรให้แสดงวงแหวนสีเทา)
    let dieselData = dieselAmt > 0 ? [dieselAmt] : [1];
    let dieselColor = dieselAmt > 0 ? ['#3b82f6'] : ['#f1f5f9']; // น้ำเงิน หรือ เทา
    
    let benzeneData = benzeneAmt > 0 ? [benzeneAmt] : [1];
    let benzeneColor = benzeneAmt > 0 ? ['#10b981'] : ['#f1f5f9']; // เขียว หรือ เทา

    // 4. วาดกราฟโดนัทฝั่งซ้าย (ดีเซล)
    const ctxDiesel = document.getElementById('dieselDonut');
    if (ctxDiesel) {
        if (dieselChartInstance) dieselChartInstance.destroy();
        dieselChartInstance = new Chart(ctxDiesel, {
            type: 'doughnut',
            data: {
                labels: ['ดีเซล'],
                datasets: [{ data: dieselData, backgroundColor: dieselColor, borderWidth: 0 }]
            },
            options: getDonutOptions()
        });
    }

    // 5. วาดกราฟโดนัทฝั่งขวา (เบนซิน/แก๊สโซฮอล์)
    const ctxBenzene = document.getElementById('benzeneDonut');
    if (ctxBenzene) {
        if (benzeneChartInstance) benzeneChartInstance.destroy();
        benzeneChartInstance = new Chart(ctxBenzene, {
            type: 'doughnut',
            data: {
                labels: ['เบนซิน/แก๊สโซฮอล์'],
                datasets: [{ data: benzeneData, backgroundColor: benzeneColor, borderWidth: 0 }]
            },
            options: getDonutOptions()
        });
    }
}

function applyFuelDateRange() {
    const startVal = document.getElementById('fuelStartDate').value;
    const endVal = document.getElementById('fuelEndDate').value;
    
    const startDate = startVal ? new Date(startVal).getTime() : 0;
    const endDate = endVal ? new Date(endVal).setHours(23, 59, 59, 999) : new Date('9999-12-31').getTime();

    let activeTableId = "";
    let dateColumnIndex = 0;

    if (!document.getElementById('fuelDepotSection').classList.contains('hidden')) {
        activeTableId = 'fuelDepotTableBody';
        dateColumnIndex = 1; 
    } else if (!document.getElementById('fuelLogSection').classList.contains('hidden')) {
        activeTableId = 'fuelLogTableBody';
        dateColumnIndex = 0; 
    }

    if (!activeTableId) {
        alert("หน้านี้ไม่มีข้อมูลให้กรองวันที่ครับ");
        return;
    }

    let totalUsedLiters = 0; // ตัวแปรสำหรับเก็บยอดน้ำมันรวม

    const rows = document.querySelectorAll(`#${activeTableId} tr`);
    
    rows.forEach((row) => {
        if(row.children.length <= 1) return; 

        let dateText = row.children[dateColumnIndex].innerText.trim();
        let rowTime = parseThaiDate(dateText);

        if (rowTime >= startDate && rowTime <= endDate) {
            row.style.display = ''; // แสดงผลแถวนี้
            
            // 🎯 ถ้านี่คือตาราง "ประวัติเติมน้ำมัน" ให้ดึงค่าจากคอลัมน์ที่ 4 (index 3) มาบวกเพิ่ม
            if (activeTableId === 'fuelLogTableBody') {
                let literText = row.children[3].innerText.replace(/,/g, ''); // ตัดลูกน้ำออกก่อนคำนวณ
                let literValue = parseFloat(literText) || 0;
                totalUsedLiters += literValue;
            }
            
        } else {
            row.style.display = 'none'; // ซ่อนแถวนี้
        }
    });

    // 🎯 อัปเดตตัวเลขบนหน้า Dashboard (กล่องที่ 3)
    if (activeTableId === 'fuelLogTableBody') {
        const dashUsedEl = document.getElementById('dashFuelUsed');
        if (dashUsedEl) {
            // ใส่ลูกน้ำ (comma) กลับเข้าไปให้ดูสวยงาม
            dashUsedEl.innerText = totalUsedLiters.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }
    }

    toggleModal('fuelFilterModal', false);
}

// ฟังก์ชันแปลงวันที่แบบกันตาย (คงไว้เหมือนเดิมครับ)
function parseThaiDate(dateStr) {
    if (!dateStr) return 0;
    let parts = dateStr.split('/');
    if (parts.length === 3) {
        let d = parseInt(parts[0]);
        let m = parseInt(parts[1]) - 1;
        let y = parseInt(parts[2]);
        if (y > 2500) y -= 543;
        return new Date(y, m, d).getTime();
    }
    let d = new Date(dateStr);
    return isNaN(d.getTime()) ? 0 : d.getTime();
}

// ฟังก์ชันแปลงวันที่แบบกันตาย (อ่านได้ทั้ง 02/06/2026 และ 02/06/2569)
function parseThaiDate(dateStr) {
    if (!dateStr) return 0;
    
    // พยายาม split ด้วย /
    let parts = dateStr.split('/');
    if (parts.length === 3) {
        let d = parseInt(parts[0]);
        let m = parseInt(parts[1]) - 1;
        let y = parseInt(parts[2]);
        if (y > 2500) y -= 543; // แปลง พ.ศ. เป็น ค.ศ.
        return new Date(y, m, d).getTime();
    }
    
    // ถ้าไม่ใช่ format / ให้ลองอ่านแบบปกติ
    let d = new Date(dateStr);
    return isNaN(d.getTime()) ? 0 : d.getTime();
}

// 🎯 ฟังก์ชันเสริม: แปลงวันที่ (รองรับรูปแบบ 02/06/2026 หรือ 02/06/2569)
function parseThaiDate(dateStr) {
    if (!dateStr) return new Date(0);
    
    // พยายาม split ด้วย /
    let parts = dateStr.split('/');
    if (parts.length === 3) {
        let day = parseInt(parts[0]);
        let month = parseInt(parts[1]) - 1; // เดือนใน JS เริ่มที่ 0
        let year = parseInt(parts[2]);
        
        // ถ้าปีเกิน 2500 ให้ลบ 543 เพื่อเป็น ค.ศ.
        if (year > 2500) year -= 543;
        
        return new Date(year, month, day).getTime();
    }
    
    // ถ้าไม่เข้าเงื่อนไข ให้ลองอ่านแบบปกติ
    return new Date(dateStr).getTime();
}

// 1. ฟังก์ชันโหลดรายชื่อรถเข้า Dropdown (ดึงจาก Google Sheet)
// ฟังก์ชันโหลดรายชื่อรถเข้า Dropdown
// 1. ฟังก์ชันโหลดตัวเลือกรถ (เพิ่มการดึงชื่อพลขับ)
function loadVehicleOptions() {
    google.script.run
        .withFailureHandler(function(error) {
            console.error("❌ โหลดข้อมูลรถไม่ได้:", error);
        })
        .withSuccessHandler(function(data) {
            const select = document.getElementById('uVehicle');
            select.innerHTML = '<option value="">-- เลือกรถยนต์ --</option>';

            if (!data || data.length === 0) return;

            data.forEach(function(row) {
                if (!row || !row[3]) return;

                let option = document.createElement('option');
                
                // 🔴 ดึงค่าให้ครบตามคอลัมน์ใน Sheet
                let vehicleId = row[0] || '';    // คอลัมน์ A (Index 0): รหัสรถ (V1780...)
                let brand = row[2] || '';        // คอลัมน์ C (Index 2): ยี่ห้อ
                let plate = row[3] || '';        // คอลัมน์ D (Index 3): ทะเบียน
                let currentMileage = row[7] || 0; // คอลัมน์ H (Index 7): เลขไมล์
                let driverName = row[8] || '';   // คอลัมน์ I (Index 8): พลขับ

                // 🎯 จุดสำคัญ: ตั้งค่า value เป็น "รหัสรถ" เพื่อให้ระบบหลังบ้านบันทึกลงถูกช่อง
                option.value = vehicleId; 
                
                // ข้อความที่โชว์ให้ผู้ใช้เห็นตอนเลือก
                option.text = `${plate} ${brand ? `(${brand})` : ''}`;
                
                // ซ่อนข้อมูลอื่นๆ ไว้ดึงไปใช้
                option.setAttribute('data-reg', plate); // แอบซ่อนทะเบียนรถไว้ที่นี่
                option.setAttribute('data-mile', currentMileage);
                option.setAttribute('data-driver', driverName);

                select.appendChild(option);
            });
        })
        .getVehiclesData();
}

// 2. ฟังก์ชันเมื่อเปลี่ยนรถ (ดึงทั้งไมล์และชื่อพลขับมาแสดง)
function handleUsageVehicleChange() {

    const mileageInput = document.getElementById('uStartMileage');
    const driverInput = document.getElementById('uDriver');

    // เช็คว่าผู้ใช้ได้เลือกรถจริงๆ หรือไม่
    if (sel.selectedIndex > 0) {

        mileageInput.value = opt.getAttribute('data-mile') || 0;
        
        // 🔴 ดึงชื่อพลขับมาใส่ในช่องให้อัตโนมัติ!
        driverInput.value = opt.getAttribute('data-driver') || '';
        
    } else {

// ฟังก์ชันสำหรับเปิดหน้าต่างบันทึกการใช้รถ
// ฟังก์ชันสำหรับเปิดหน้าต่างบันทึกการใช้รถ (เพิ่มเวลาอัตโนมัติ)
function openAddUsageModal() {
    // 1. ดึงเวลาปัจจุบันและปรับเป็นเวลาประเทศไทย (GMT+7)
    let now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset()); 
    let currentDateTime = now.toISOString().slice(0, 16); // จะได้ฟอร์แมต YYYY-MM-DDThh:mm
    
    // 2. นำเวลาที่ได้ไปใส่รอไว้ในช่อง "วันเวลาเดินทางออก"
    const departureInput = document.getElementById('uDepartureTime');
    if (departureInput) {
        departureInput.value = currentDateTime;
    }

    // 3. เปิดหน้าต่าง
    toggleModal('usageModal', true); 
    
    // 4. สั่งโหลดรายชื่อรถ
    loadVehicleOptions();            
}

function handleRegister(event) {
    event.preventDefault(); // ป้องกันเว็บรีเฟรช
    
    const btn = document.getElementById('btnRegisterSubmit'); 
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังอัปโหลด...';
    btn.disabled = true;

    // 1. สร้างแพ็กเกจข้อมูล ดึงค่าจาก ID จริงในฟอร์มของคุณ
    const userData = {
        name: document.getElementById('regFullName').value,       
        department: document.getElementById('regDept').value, 
        username: document.getElementById('regUser').value, 
        password: document.getElementById('regPass').value,
        base64Profile: "", 
        mimeType: "",
        fileName: ""
    };

    const fileInput = document.getElementById('regProfilePic');

    // 2. ถ้ามีการเลือกรูปภาพ ให้แปลงไฟล์ก่อนส่ง
    if (fileInput && fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onload = function(e) {
            userData.base64Profile = e.target.result; 
            userData.mimeType = file.type;
            userData.fileName = file.name;
            
            callRegisterBackend(userData, originalText, btn);
        };
        reader.readAsDataURL(file);
    } else {
        // ถ้าไม่ใส่รูป ก็ส่งไปแบบว่างๆ
        callRegisterBackend(userData, originalText, btn);
    }
}

// ฟังก์ชันส่งข้อมูลไปหลังบ้าน
function callRegisterBackend(userData, originalText, btn) {
    google.script.run.withSuccessHandler(function(response) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        
        if(response.success) {
            alert(response.message);
            
            // ล้างข้อมูลฟอร์ม และซ่อน Modal
            document.getElementById('regFullName').value = '';
            document.getElementById('regDept').value = '';
            document.getElementById('regUser').value = '';
            document.getElementById('regPass').value = '';
            document.getElementById('regProfilePic').value = '';
            toggleSignup(false); 
            
        } else {
            alert("ข้อผิดพลาด: " + response.message);
        }
    }).registerUser(userData); // ส่งไปที่ฟังก์ชัน registerUser ใน Code.gs
}

function renderVehicleChart(chartData) {
    const ctx = document.getElementById('vehicleChart').getContext('2d');
    
    // ถ้าเคยกราฟมีอยู่แล้ว ให้ลบก่อนวาดใหม่ (ป้องกัน Error)
    if (myChart) myChart.destroy();

    myChart = new Chart(ctx, {
        type: 'bar', // หรือ 'line' ถ้าอยากดูแนวโน้ม
        data: {
            labels: chartData.labels, // เช่น ['จันทร์', 'อังคาร', ...]
            datasets: [{
                label: 'จำนวนครั้งที่ใช้รถ',
                data: chartData.values, // เช่น [5, 3, 8, 2]
                backgroundColor: '#3b82f6', // สีฟ้าสไตล์ทันสมัย
                borderRadius: 8, // ทำให้แท่งกราฟโค้งมน ดูนุ่มนวล
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }, // ซ่อนชื่อกราฟถ้าไม่จำเป็น
            scales: {
                y: { beginAtZero: true, grid: { borderDash: [5, 5] } },
                x: { grid: { display: false } }
            }
        }
    });
}

// 2. ฟังก์ชันประมวลผลข้อมูลและวาด UI
// 2. ฟังก์ชันประมวลผลข้อมูลและวาด UI (เวอร์ชันอัปเกรด)
function renderActiveVehicleFuelCard() {
    const listContainer = document.getElementById('activeVehicleFuelList');
    if (!listContainer) return;

    // กรองเฉพาะคันที่ "อยู่ระหว่างภารกิจ" (ยังไม่กลับ)
    let activeUsages = vehicleUsages.filter(u => u.status === 'อยู่ระหว่างภารกิจ');
    
    // (ถ้า ร.ท.ยงยุทธ์ ยืนยันว่าอยากได้ "เฉพาะวันนี้จริงๆ" ให้ลบ // หน้าบรรทัดข้างล่างนี้ออกครับ)
    // const todayStr = new Date().toISOString().split('T')[0];
    // activeUsages = activeUsages.filter(u => String(u.departureTime).startsWith(todayStr));

    // เรียงลำดับให้รถที่เพิ่งออกล่าสุด อยู่บนสุด
    activeUsages.sort((a, b) => new Date(b.departureTime) - new Date(a.departureTime));
    
    // อัปเดตตัวเลขคันที่ออกภารกิจ
    const countEl = document.getElementById('activeMissionCount');
    if (countEl) countEl.innerText = activeUsages.length;
    
    // อัปเดตเปอร์เซ็นต์
    const percentEl = document.getElementById('activeMissionPercent');
    const totalVehicles = vehicles.length > 0 ? vehicles.length : 1; 
    const percentActive = Math.round((activeUsages.length / totalVehicles) * 100);
    if (percentEl) percentEl.innerHTML = `<i class="fa-solid fa-car-side text-slate-500"></i> ${percentActive}%`;

    // กรณีไม่มีรถออกภารกิจเลย
    if (activeUsages.length === 0) {
        listContainer.innerHTML = `
            <div class="py-6 text-center text-slate-400 flex flex-col items-center">
                <i class="fa-solid fa-circle-check text-3xl mb-2 text-emerald-400/50"></i>
                <span class="text-xs font-medium">รถทุกคันจอดอยู่ที่หน่วย</span>
            </div>`;
        return;
    }

    let html = '';
    const todayStr = new Date().toISOString().split('T')[0]; // ดึงวันที่ปัจจุบัน
    
    // ลูปสร้างรายการ (โชว์สูงสุด 5 คันล่าสุด)
    activeUsages.slice(0, 5).forEach(usage => {
        const vehicleInfo = vehicles.find(v => v.id === usage.vehicleId) || {};
        const currentFuel = parseFloat(vehicleInfo.fuelInTank) || 0;
        const maxCapacity = parseFloat(vehicleInfo.quota) || 70; 
        
        let fuelPercentage = Math.round((currentFuel / maxCapacity) * 100);
        if (fuelPercentage > 100) fuelPercentage = 100;

        let barColorClass = "bg-teal-600";
        let badgeColorClass = "bg-teal-50 text-teal-700 border-teal-100";
        
        if (fuelPercentage <= 20) {
            barColorClass = "bg-rose-500";
            badgeColorClass = "bg-rose-50 text-rose-700 border-rose-100";
        } else if (fuelPercentage <= 40) {
            barColorClass = "bg-amber-500";
            badgeColorClass = "bg-amber-50 text-amber-700 border-amber-100";
        }

        // 🌟 ไอเดียเสริม: เช็คว่าออกวันนี้ หรือ ค้างคืน
        let timeBadge = '';
        if (String(usage.departureTime).startsWith(todayStr)) {
            timeBadge = '<span class="text-[9px] font-bold bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded border border-blue-100 ml-1.5">วันนี้</span>';
        } else {
            timeBadge = '<span class="text-[9px] font-bold bg-rose-50 text-rose-600 px-1.5 py-0.5 rounded border border-rose-200 ml-1.5 shadow-sm"><i class="fa-regular fa-clock mr-0.5"></i>ค้างคืน</span>';
        }

        // 🌟 ไอเดียเสริม: ดึงวัตถุประสงค์ (purpose) มาโชว์แบบย่อๆ
        let purposeText = usage.purpose ? usage.purpose : 'ไม่ระบุภารกิจ';

        html += `
        <div class="group">
          <div class="flex justify-between items-end mb-1.5">
            <div class="flex flex-col">
               <div class="flex items-center">
                  <span class="text-[13px] font-bold text-slate-800 truncate max-w-[120px]" title="${usage.vehicleReg}">
                    ${usage.vehicleReg}
                  </span>
                  ${timeBadge}
               </div>
               <span class="text-[10px] text-slate-500 truncate max-w-[160px] mt-0.5" title="${purposeText}">
                 <i class="fa-solid fa-location-dot text-slate-300 mr-1"></i>${purposeText} (${usage.driver})
               </span>
            </div>
            
            <div class="flex items-center gap-2 shrink-0 pb-1">
              <span class="text-[13px] font-bold text-slate-900">${currentFuel.toLocaleString()} <span class="text-[10px] font-normal text-slate-500">ลิตร</span></span>
              <span class="px-2 py-0.5 ${badgeColorClass} text-[10px] font-bold rounded-full border shadow-sm">${fuelPercentage}%</span>
            </div>
          </div>
          <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden border border-slate-100">
            <div class="${barColorClass} h-full rounded-full transition-all duration-1000" style="width: 0%" data-target-width="${fuelPercentage}%"></div>
          </div>
        </div>
        `;
    });

    listContainer.innerHTML = html;

    // แอนิเมชันหลอดน้ำมัน
    setTimeout(() => {
        const bars = listContainer.querySelectorAll('[data-target-width]');
        bars.forEach(bar => {
            bar.style.width = bar.getAttribute('data-target-width');
        });
    }, 100);
}

// 3. ฟังก์ชันส่งออกเป็น Excel (รูปแบบ CSV ที่รองรับภาษาไทย)
function exportPendingDocsToExcel() {
    let table = document.getElementById("pendingDocsTable");
    let rows = table.querySelectorAll("tr");
    let csv = [];
    
    for (let i = 0; i < rows.length; i++) {
        let row = [], cols = rows[i].querySelectorAll("td, th");
        for (let j = 0; j < cols.length; j++) {
            let data = cols[j].innerText.replace(/"/g, '""'); // ป้องกัน Error จากเครื่องหมายคำพูด
            row.push('"' + data + '"');
        }
        csv.push(row.join(","));
    }
    
    let csvString = csv.join("\n");
    let title = document.getElementById('pendingDocsTitle').innerText;
    
    // ใส่ BOM (\uFEFF) เพื่อให้ Excel อ่านภาษาไทย (UTF-8) ได้ถูกต้อง
    let blob = new Blob(["\uFEFF" + csvString], { type: 'text/csv;charset=utf-8;' });
    let link = document.createElement("a");
    let url = URL.createObjectURL(blob);
    
    link.setAttribute("href", url);
    link.setAttribute("download", title + ".csv");
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
