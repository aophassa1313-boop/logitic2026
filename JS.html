    itemSerial: document.getElementById('repairItemSerial').value.trim(),
    qty: document.getElementById('repairQty').value,
    unitType: document.getElementById('repairUnitType').value.trim(),
    symptom: document.getElementById('repairSymptom').value.trim()
  };

  const onSuccess = (res) => {
    if (res.success) {
      showToast(res.message, 'success');
      closeRepairModal();
      loadRepairData(); // โหลดตารางใหม่
    } else {
      showToast('ผิดพลาด: ' + res.message, 'error');
    }
    btn.disabled = false;
  };

  const onFailure = (err) => {
    showToast('เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว', 'error');
    btn.disabled = false;
  };

  if (currentEditDocNo) {
    // ถ้าตัวแปรนี้มีค่า แปลว่าเป็นการ "แก้ไขข้อมูล"
    repairData.originalDocNo = currentEditDocNo;
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).updateRepairRecord(repairData);
  } else {
    // ถ้าไม่มีค่า แปลว่าเป็นการ "เพิ่มข้อมูลใหม่"
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).saveRepairToSheet(repairData);
  }
}

// ฟังก์ชันเปิด Pop-up
// ตัวอย่าง: สมมติว่านี่คือฟังก์ชันตอนกดปุ่ม "เพิ่มรายการส่งซ่อม"
// ฟังก์ชันเปิด Modal สำหรับทะเบียนส่งซ่อม
function openRepairModal() {
  const modal = document.getElementById('repairModal');
  const docNoInput = document.getElementById('repairDocNo'); // ล็อค ID ที่ถูกต้อง
  
  // 1. เปิด Modal
  modal.classList.remove('hidden');
  
  // 2. เคลียร์ฟอร์ม
  document.getElementById('repairForm').reset();
  document.getElementById('repairDate').value = new Date().toISOString().split('T')[0];
  
  // 3. แสดงข้อความรอเลข (ป้องกันเลข 2 ค้าง)
  docNoInput.value = 'กำลังรันเลข...';

  // 4. ดึงเลขจากหลังบ้าน
  google.script.run
    .withSuccessHandler(function(number) {
       docNoInput.value = number; // ใส่เลขที่ถูกต้องลงไป
    })
    .withFailureHandler(function(err) {
       console.error("ดึงเลขพลาด:", err);
       docNoInput.value = "Error";
    })
    .getNextRepairNumber();
}

// ฟังก์ชันปิด Modal
function closeRepairModal() {
  document.getElementById('repairModal').classList.add('hidden');
}

// อัปเดตฟังก์ชันปิดหน้าต่าง เพื่อล้างค่าโหมดการแก้ไขทิ้ง
function closeRepairModal() {
  document.getElementById('repairModal').classList.add('hidden');
  document.getElementById('repairForm').reset();
  currentEditDocNo = null; // รีเซ็ตสถานะการแก้ไข
  document.getElementById('btnSaveRepair').innerHTML = '<i class="fa fa-save"></i> บันทึกข้อมูลส่งซ่อม'; // คืนค่าปุ่ม
}

// ฟังก์ชันสำหรับเรนเดอร์ข้อมูลลงตาราง
function renderRepairTable(repairDataArray) {
  const tbody = document.getElementById('repairTableBody');
  if (!tbody) return;

  if (!repairDataArray || repairDataArray.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="px-5 py-10 text-center text-slate-400">ยังไม่มีข้อมูลทะเบียนส่งซ่อม</td></tr>`;
    return;
  }

  const rowsHtml = repairDataArray.map(row => {
    
    // ==========================================
    // 1. จัดการสีของป้ายสถานะ (Badge)
    // ==========================================
    let statusBadge = '';
    const status = String(row['สถานะงานซ่อม'] || 'รอรับเรื่อง').trim();
    
    if (status.includes('เสร็จสิ้น') || status.includes('ส่งคืน')) {
      statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">${status}</span>`;
    } else if (status.includes('จำหน่าย') || status.includes('ชำรุด') || status.includes('ซ่อมไม่คุ้มค่า')) {
      statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-200"><i class="fa fa-ban mr-1"></i>${status}</span>`;
    } else {
      statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-200">${status}</span>`;
    }

    // ==========================================
    // 2. สร้างปุ่มลิงก์โหลดหลักฐาน
    // ==========================================
    const evidenceLink = String(row['ลิงก์หลักฐาน'] || '').trim();
    let evidenceHtml = '';
    if (evidenceLink && evidenceLink !== '') {
      evidenceHtml = `
        <div class="mt-2 flex justify-center">
          <a href="${evidenceLink}" target="_blank" class="inline-flex items-center px-2 py-1 rounded text-[10px] font-bold bg-white text-slate-600 border border-slate-300 hover:bg-slate-50 hover:text-blue-600 transition shadow-sm" title="คลิกเพื่อดูหลักฐาน">
            <i class="fa-solid fa-file-invoice mr-1.5 text-rose-500"></i> โหลดหลักฐาน
          </a>
        </div>
      `;
    }

    // ==========================================
    // 3. จัดการสีของสาย สป.
    // ==========================================
    const category = row['สป. สาย'] || '-';
    let catColor = 'bg-slate-100 text-slate-600 border-slate-200';
    if(category.includes('ส.')) catColor = 'bg-purple-100 text-purple-700 border-purple-200';
    else if(category.includes('ยย.')) catColor = 'bg-amber-100 text-amber-700 border-amber-200';
    else if(category.includes('พธ.')) catColor = 'bg-indigo-100 text-indigo-700 border-indigo-200';
    else if(category.includes('ขส.')) catColor = 'bg-sky-100 text-sky-700 border-sky-200';

    let displayDate = row['วันที่ส่งซ่อม'] || '-';
    if(String(displayDate).includes('T')) displayDate = String(displayDate).split('T')[0];

    const docNo = row['ที่ใบส่งซ่อม'] || '';

    return `
      <tr class="hover:bg-slate-50 transition group">
        <td class="px-5 py-4">
          <div class="font-bold text-slate-800">${docNo}</div>
          <div class="text-[11px] text-slate-400 mt-0.5">วันที่: ${displayDate}</div>
        </td>
        <td class="px-5 py-4">
          <div class="font-bold text-slate-800 text-sm truncate max-w-[200px] md:max-w-[250px]">${row['รายการสิ่งอุปกรณ์'] || '-'}</div>
          <div class="text-[11px] text-slate-500 truncate max-w-[200px] md:max-w-[250px] mt-0.5"><i class="fa-solid fa-triangle-exclamation text-rose-400 mr-1"></i>${row['อาการชำรุด'] || '-'}</div>
        </td>
        <td class="px-5 py-4 text-center">
          <div class="font-bold text-slate-700">${row['จำนวน'] || '0'}</div>
          <div class="text-[10px] text-slate-400">${row['หน่วยนับ'] || '-'}</div>
        </td>
        <td class="px-5 py-4">
          <div class="text-sm font-medium text-slate-700">${row['หน่วยส่งซ่อม'] || '-'}</div>
          <div class="mt-1">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold ${catColor} border">สาย ${category}</span>
          </div>
        </td>
        
        <td class="px-5 py-4 text-center">
          <div>${statusBadge}</div>
          ${evidenceHtml}
        </td>

        <td class="px-5 py-4">
          <div class="flex items-center justify-center gap-1.5 opacity-80 group-hover:opacity-100 transition">
            <button onclick="editRepair('${docNo}')" class="w-7 h-7 rounded flex items-center justify-center text-amber-600 bg-amber-50 hover:bg-amber-100 hover:text-amber-700 transition border border-amber-200/50" title="แก้ไข">
              <i class="fa fa-edit text-[11px]"></i>
            </button>
            <button onclick="deleteRepair('${docNo}')" class="w-7 h-7 rounded flex items-center justify-center text-rose-600 bg-rose-50 hover:bg-rose-100 hover:text-rose-700 transition border border-rose-200/50" title="ลบ">
              <i class="fa fa-trash-can text-[11px]"></i>
            </button>
            <button onclick="openOutcomeModal('${docNo}')" class="w-7 h-7 rounded flex items-center justify-center text-emerald-600 bg-emerald-50 hover:bg-emerald-100 hover:text-emerald-700 transition border border-emerald-200/50" title="บันทึกผล / แนบหลักฐาน">
              <i class="fa fa-clipboard-check text-[11px]"></i>
            </button>
          </div>
        </td>
      </tr>`;
  }).join('');
  
  tbody.innerHTML = rowsHtml;
}

// 3. ฟังก์ชันสำหรับโหลดข้อมูลจาก Google Sheets
// ฟังก์ชันที่ 1: ไปดึงข้อมูลจากหลังบ้าน
// ==========================================
// ส่วนที่ 1: ตัวแปรและการดึงข้อมูล
// ==========================================


function loadRepairData() {
  const tbody = document.getElementById('repairTableBody');
  if(!tbody) return;
  tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10"><i class="fa fa-spinner fa-spin text-blue-500 text-2xl"></i><p class="text-slate-400 text-xs mt-2">กำลังโหลดข้อมูลทะเบียนส่งซ่อม...</p></td></tr>';

  google.script.run
    .withSuccessHandler(data => {
      globalRepairData = data; // บันทึกข้อมูลไว้ใช้ตอนกดแก้ไข
      renderRepairTable(data);
    })
    .withFailureHandler(err => {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-rose-500">เกิดข้อผิดพลาดในการดึงข้อมูล</td></tr>';
    })
    .getRepairRecords();
}

// ฟังก์ชันที่ 2: วาดข้อมูลลงตาราง
// ==========================================
// ส่วนที่ 2: วาดตาราง (สลับตำแหน่งคอลัมน์แล้ว)
// ==========================================
function renderRepairTable(repairDataArray) {
  const tbody = document.getElementById('repairTableBody');
  if (!tbody) return;

  const rowsHtml = repairDataArray.map(row => {
    // ดีบั๊ก: ลองเช็กว่า key ใน row คืออะไรกันแน่ (กด F12 ดูได้ครับ)
    // console.log("Key ในข้อมูลนี้มีอะไรบ้าง:", Object.keys(row));

    // สถานะ
    let statusBadge = '';
    const status = String(row['สถานะงานซ่อม'] || 'รอรับเรื่อง').trim();
    
    // เลือกสีตามสถานะ
    if (status.includes('เสร็จสิ้น') || status.includes('ส่งคืน')) {
      statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">${status}</span>`;
    } else if (status.includes('จำหน่าย') || status.includes('ชำรุด') || status.includes('ซ่อมไม่คุ้มค่า')) {
      statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-200"><i class="fa fa-ban mr-1"></i>${status}</span>`;
    } else {
      statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-200">${status}</span>`;
    }

    // [จุดที่แก้] ดึงลิงก์หลักฐาน (เช็กทั้งแบบมีช่องว่างและไม่มี)
    const linkKey = Object.keys(row).find(k => k.trim() === 'ลิงก์หลักฐาน');
    const evidenceLink = linkKey ? String(row[linkKey] || '').trim() : '';

    let evidenceHtml = '';
    if (evidenceLink && evidenceLink !== '') {
      evidenceHtml = `
        <div class="mt-2 flex justify-center">
          <a href="${evidenceLink}" target="_blank" class="inline-flex items-center px-2 py-1 rounded text-[10px] font-bold bg-white text-slate-600 border border-slate-300 hover:bg-slate-50 hover:text-blue-600 transition shadow-sm" title="โหลดหลักฐาน">
            <i class="fa-solid fa-file-invoice mr-1.5 text-rose-500"></i> โหลดหลักฐาน
          </a>
        </div>`;
    }

    return `
      <tr class="hover:bg-slate-50 transition group">
        <td class="px-5 py-4">
          <div class="font-bold text-slate-800">${row['ที่ใบส่งซ่อม'] || '-'}</div>
          <div class="text-[11px] text-slate-400 mt-0.5">วันที่: ${String(row['วันที่ส่งซ่อม'] || '-').split('T')[0]}</div>
        </td>
        <td class="px-5 py-4">
          <div class="font-bold text-slate-800 text-sm">${row['รายการสิ่งอุปกรณ์'] || '-'}</div>
          <div class="text-[11px] text-slate-500 mt-0.5"><i class="fa-solid fa-triangle-exclamation text-rose-400 mr-1"></i>${row['อาการชำรุด'] || '-'}</div>
        </td>
        <td class="px-5 py-4 text-center">
          <div class="font-bold text-slate-700">${row['จำนวน'] || '0'}</div>
          <div class="text-[10px] text-slate-400">${row['หน่วยนับ'] || '-'}</div>
        </td>
        <td class="px-5 py-4">
          <div class="text-sm font-medium text-slate-700">${row['หน่วยส่งซ่อม'] || '-'}</div>
          <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-purple-100 text-purple-700 border border-purple-200">สาย ${row['สป. สาย'] || '-'}</span>
        </td>
        
        <td class="px-5 py-4 text-center">
          <div>${statusBadge}</div>
          ${evidenceHtml}
        </td>

        <td class="px-5 py-4">
          <div class="flex items-center justify-center gap-1.5">
             <button onclick="editRepair('${row['ที่ใบส่งซ่อม']}')" class="w-7 h-7 rounded flex items-center justify-center text-amber-600 bg-amber-50 border border-amber-200/50" title="แก้ไข"><i class="fa fa-edit text-[11px]"></i></button>
             <button onclick="deleteRepair('${row['ที่ใบส่งซ่อม']}')" class="w-7 h-7 rounded flex items-center justify-center text-rose-600 bg-rose-50 border border-rose-200/50" title="ลบ"><i class="fa fa-trash-can text-[11px]"></i></button>
             <button onclick="openOutcomeModal('${row['ที่ใบส่งซ่อม']}')" class="w-7 h-7 rounded flex items-center justify-center text-emerald-600 bg-emerald-50 border border-emerald-200/50" title="แนบหลักฐาน"><i class="fa fa-clipboard-check text-[11px]"></i></button>
          </div>
        </td>
      </tr>`;
  }).join('');
  
  tbody.innerHTML = rowsHtml;
}

// ==========================================
// ส่วนที่ 4: ฟังก์ชันจัดการตอนกดปุ่ม (แก้ไข/ลบ/ปิดฟอร์ม)
// ==========================================
function deleteRepair(docNo) {
  if(!confirm(`คุณต้องการลบข้อมูลใบส่งซ่อมที่: ${docNo} ใช่หรือไม่?`)) return;
  
  showToast('กำลังลบข้อมูล...', 'info');
  google.script.run
    .withSuccessHandler(res => {
      if(res.success) {
        showToast('ลบข้อมูลสำเร็จ', 'success');
        loadRepairData(); // อัปเดตตาราง
      } else {
        showToast('ลบไม่สำเร็จ: ' + res.message, 'error');
      }
    })
    .deleteRepairRecord(docNo);
}

function editRepair(docNo) {
  // ดึงข้อมูลเดิมจากตัวแปรที่เก็บไว้
  const record = globalRepairData.find(r => String(r['ที่ใบส่งซ่อม']) === String(docNo));
  if(!record) return showToast('ไม่พบข้อมูลที่จะแก้ไข', 'error');

  currentEditDocNo = docNo; // ล็อกไว้ว่ากำลังแก้ข้อมูลไหนอยู่

  // นำข้อมูลไปหยอดใส่ฟอร์ม
  document.getElementById('repairDocNo').value = record['ที่ใบส่งซ่อม'] || '';
  
  let dateVal = record['วันที่ส่งซ่อม'] || '';
  if(dateVal.includes('T')) dateVal = dateVal.split('T')[0];
  document.getElementById('repairDate').value = dateVal;

  document.getElementById('repairCategory').value = record['สป. สาย'] || '';
  document.getElementById('repairUnit').value = record['หน่วยส่งซ่อม'] || '';
  document.getElementById('repairItemName').value = record['รายการสิ่งอุปกรณ์'] || '';
  document.getElementById('repairItemSerial').value = record['หมายเลขสิ่งอุปกรณ์'] || '';
  document.getElementById('repairQty').value = record['จำนวน'] || '';
  document.getElementById('repairUnitType').value = record['หน่วยนับ'] || '';
  document.getElementById('repairSymptom').value = record['อาการชำรุด'] || '';

  // เปลี่ยนชื่อปุ่มและเปิดฟอร์ม
  document.getElementById('btnSaveRepair').innerHTML = '<i class="fa fa-save"></i> บันทึกการแก้ไข';
  document.getElementById('repairModal').classList.remove('hidden');
}

// ฟังก์ชันสำหรับเช็กและพับ Sidebar บนมือถือ
function toggleSidebarCheck() {
  if (typeof toggleSidebar === 'function') {
    toggleSidebar();
  } else {
    console.log("ปิด Sidebar");
  }
}

// ฟังก์ชันกดบันทึกผลการดำเนินการ
// ฟังก์ชันกดบันทึกผลการดำเนินการ (เวอร์ชันอัปเกรด แก้บั๊กปุ่มค้าง)
function handleSaveOutcome(e) {
  e.preventDefault(); // ป้องกันเว็บรีเฟรชตัวเอง
  
  const btn = document.getElementById('btnSaveOutcome');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังเตรียมข้อมูล...';

  try {
    const fileInput = document.getElementById('outcomeEvidence');
    let file = null;
    
    // ตรวจสอบว่ามีช่องอัปโหลดไฟล์ และมีการเลือกไฟล์ไว้หรือไม่
    if (fileInput && fileInput.files && fileInput.files.length > 0) {
      file = fileInput.files[0];
    }

    if (file) {
      btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังอ่านไฟล์...';
      const reader = new FileReader();
      
      reader.onload = function(event) {
        const base64Data = event.target.result.split(',')[1];
        const fileData = {
          filename: file.name,
          mimeType: file.type,
          base64: base64Data
        };
        submitOutcomeData(fileData); // ส่งข้อมูลพร้อมไฟล์
      };
      
      reader.onerror = function(err) {
        showToast('อ่านไฟล์ไม่สำเร็จ กรุณาลองใหม่', 'error');
        resetOutcomeButton();
      };
      
      reader.readAsDataURL(file);
    } else {
      // กรณีไม่มีไฟล์แนบ
      submitOutcomeData(null); 
    }

  } catch (error) {
    console.error("เกิดข้อผิดพลาดที่หน้าเว็บ: ", error);
    showToast('ระบบขัดข้อง: ' + error.message, 'error');
    resetOutcomeButton();
  }

  // ฟังก์ชันย่อยสำหรับส่งข้อมูลไปให้ Code.gs
  function submitOutcomeData(fileData) {
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...';
    
    const data = {
      docNo: currentOutcomeDocNo,
      status: document.getElementById('outcomeStatus').value,
      detail: document.getElementById('outcomeDetail').value,
      file: fileData
    };

    console.log("ข้อมูลที่กำลังส่งไปหลังบ้าน: ", data);

    google.script.run
      .withSuccessHandler(res => {
        console.log("หลังบ้านตอบกลับ: ", res);
        if (res.success) {
          showToast(res.message || 'บันทึกผลสำเร็จ', 'success');
          closeOutcomeModal();
          
          // โหลดตารางใหม่เพื่อให้เห็นการอัปเดต
          if (typeof loadRepairData === 'function') {
            loadRepairData(); 
          }
        } else {
          showToast('บันทึกไม่สำเร็จ: ' + res.message, 'error');
        }
        resetOutcomeButton();
      })
      .withFailureHandler(err => {
        console.error("ติดต่อเซิร์ฟเวอร์ล้มเหลว: ", err);
        showToast('การเชื่อมต่อล้มเหลว', 'error');
        resetOutcomeButton();
      })
      .updateRepairOutcome(data); // โทรหา Code.gs
  }

  // ฟังก์ชันย่อยสำหรับคืนค่าปุ่มกดให้กลับมาเหมือนเดิม
  function resetOutcomeButton() {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-save"></i> บันทึกผลการดำเนินการ';
  }
}

// 3. ฟังก์ชันวาดกราฟ
function renderProcurementStepChart() {
  // เช็คว่ามีข้อมูลไหม
  if (!procurementStepsData || procurementStepsData.length === 0) {
    console.warn("กราฟ Procurement: ยังไม่มีข้อมูล หรือข้อมูลเป็นค่าว่าง");
    return;
  }

  // นับจำนวนแต่ละขั้นตอน
  const counts = procurementStepsData.reduce((acc, row) => {
    const step = row['step_name'] || 'ไม่ระบุ';
    acc[step] = (acc[step] || 0) + 1;
    return acc;
  }, {});

  const labels = Object.keys(counts);
  const dataVals = Object.values(counts);

  // เช็คว่าหา Canvas เจอไหม
  const canvas = document.getElementById('procurementStepChart');
  if (!canvas) {
    console.error("กราฟ Procurement: หา id 'procurementStepChart' ใน HTML ไม่เจอ");
    return;
  }
  
  const ctx = canvas.getContext('2d');

  // ถ้ามีกราฟเก่าอยู่ให้ลบทิ้งก่อน
  if (procurementStepChart) {
    procurementStepChart.destroy();
  }

  // วาดกราฟใหม่
  procurementStepChart = new Chart(ctx, {
    type: 'doughnut', 
    data: {
      labels: labels,
      datasets: [{
        label: 'จำนวน (รายการ)',
        data: dataVals,
        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#64748b'],
        borderWidth: 0,
        hoverOffset: 4
      }]
    },
    options: { 
      responsive: true, 
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right' }
      }
    }
  });
}

function applySidebarPermissions() {
    // 1. ตรวจสอบว่าระบบโหลดข้อมูล currentUser มาหรือยัง
    if (typeof currentUser === 'undefined' || !currentUser || !currentUser.department) {

        return;
    }

    // 2. เมื่อได้ข้อมูลมาแล้ว ให้ดึงชื่อแผนก (เช็คแค่คำว่า ฝพธ ไม่ต้องสนใจจุด)
    const dept = String(currentUser.department).trim();
    
    // 3. ถ้าพบคำว่า "ฝพธ" ในชื่อแผนก
    if (dept.includes('ฝพธ')) {
        
        // รายชื่อ ID กล่องเมนูที่ต้องซ่อนทิ้ง
        const menusToHide = [
            'menuOutgoing', 'menuSummary', 'menuDaily', 'menuControl', 
            'menuRepair', 'menuFuel', 'menuUsage', 'menuAdminDept', 'menuAdminUsers'
        ];

        // สั่งซ่อนแบบเด็ดขาด (ใช้ style.display = 'none' จะชัวร์กว่า class ครับ)
        menusToHide.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none'; // สั่งปิดการแสดงผล 100%
            }
        });
    }

    setTimeout(function() {
        const subjectInput = document.getElementById('regSubject'); 
        const fromInput = document.getElementById('regFrom');       
        const typeInput = document.getElementById('regType');       

        if (subjectInput) subjectInput.value = subject;
        if (fromInput) fromInput.value = from;
